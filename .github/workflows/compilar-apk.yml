name: Compilar APK GeoCampo 2

on:
  push:
    branches: [geocampo2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Copiar la app web al proyecto Android
        run: npx cap sync android

      - name: Compilar APK GeoCampo 2
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../GeoCampo2.apk

      - name: Guardar APK en la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: GeoCampo2-apk
          path: GeoCampo2.apk

      - name: Publicar descarga (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: GeoCampo 2 — 2.0.${{ github.run_number }}
          body: GeoCampo 2 (versión nueva). Se instala aparte de GeoCampo; no lo reemplaza.
          files: GeoCampo2.apk
          target_commitish: geocampo2
          prerelease: true
          make_latest: false
