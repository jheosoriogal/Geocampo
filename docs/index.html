<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>GeoCampo 2</title>
<meta name="theme-color" content="#1f5f3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GeoCampo 2">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="vendor/leaflet.css">
<script src="vendor/leaflet.js"></script>
<script src="vendor/proj4.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="vendor/capacitor.js"></script>
<script src="vendor/turf.min.js"></script>
<script src="vendor/piexif.js"></script>
<script src="vendor/shp.min.js"></script>
<script src="vendor/shpwrite.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/geotiff.js"></script>
<script src="vendor/pdf.min.js"></script>
<style>
:root{--g:#1f5f3a;--g2:#2f855a;--tx:#1a202c;--mut:#5a6472;--acc:#e8590c;--rec:#d53f8c;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);--bar:62px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#mapwrap{position:fixed;left:0;right:0;top:0;bottom:calc(var(--bar) + var(--sb))}
#map{position:absolute;inset:0;background:#dde3e8}
#cross{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;z-index:500;pointer-events:none}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.6)}
#cross:before{left:14px;top:0;width:2px;height:30px}#cross:after{top:14px;left:0;height:2px;width:30px}
#bar{position:fixed;left:0;right:0;bottom:0;height:calc(var(--bar) + var(--sb));padding-bottom:var(--sb);background:var(--g);display:flex;z-index:1000}
#bar button{flex:1;background:none;border:0;color:#fff;font:600 11.5px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
#bar button svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#bar button:active{background:rgba(255,255,255,.18)}
#bar button:disabled{opacity:.4}
.card{background:rgba(255,255,255,.96);border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.28)}
#gps{position:fixed;top:calc(8px + var(--st));left:8px;right:62px;z-index:900;padding:6px 10px;font-size:13px;line-height:1.4;font-variant-numeric:tabular-nums}
.acc{font-weight:700}.good{color:#2f855a}.mid{color:#b7791f}.bad{color:#c53030}
.mut{color:var(--mut);font-size:12.5px}
#fab{position:fixed;right:10px;top:calc(70px + var(--st));z-index:900;display:flex;flex-direction:column;gap:10px}
#fab button{width:48px;height:48px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
#fab button svg{width:24px;height:24px;stroke:#2b6cb0;fill:none;stroke-width:2.2}
#fab button.on{background:#2b6cb0}#fab button.on svg{stroke:#fff}
.leaflet-top.leaflet-right{top:calc(180px + var(--st))}
#rec{position:fixed;left:8px;right:8px;bottom:calc(var(--bar) + var(--sb) + 8px);z-index:950;padding:10px 12px}
#rec .big{font-size:26px}
.big{font-size:28px;font-weight:800;color:var(--g);font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row.end{justify-content:flex-end}
.col{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.btn{font:600 14px system-ui,sans-serif;padding:11px 14px;border-radius:10px;border:1px solid #cbd5e0;background:#fff;color:var(--tx);min-height:44px}
.btn.pri{background:var(--g);border-color:var(--g);color:#fff}
.btn.rec{background:var(--rec);border-color:var(--rec);color:#fff}
.btn.dan{color:#c53030;border-color:#feb2b2}
.btn.grow{flex:1}
.btn:active{filter:brightness(.92)}
#sheetWrap,#dlgWrap{position:fixed;inset:0;background:rgba(0,0,0,.38);display:flex;z-index:2000}
#sheetWrap{align-items:flex-end}
#dlgWrap{z-index:3000;align-items:center;justify-content:center;padding:14px}
#sheet{background:#fff;width:100%;max-height:82vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 16px calc(18px + var(--sb))}
#dlg{background:#fff;border-radius:14px;max-width:460px;width:100%;max-height:88vh;overflow:auto;padding:16px}
h3{margin:2px 0 10px;font-size:18px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0}
input,select,textarea{font:16px system-ui,sans-serif;padding:10px;border:1px solid #cbd5e0;border-radius:8px;width:100%;margin-top:4px;color:var(--tx);background:#fff}
table.kv{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px;font-variant-numeric:tabular-nums}
table.kv td{padding:6px 4px;border-bottom:1px solid #edf2f7;vertical-align:top}
table.kv td:first-child{color:var(--mut);width:38%}
.hidden{display:none!important}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bar) + var(--sb) + 150px);background:#2d3748;color:#fff;padding:10px 14px;border-radius:8px;z-index:4000;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center;font-size:14px}
#toast.show{opacity:1}
.lyr{border:1px solid #e2e8f0;border-radius:10px;margin:8px 0;padding:8px}
.lyr-h{display:flex;align-items:center;gap:8px}
.lyr-h input[type=checkbox]{width:22px;height:22px;margin:0}
.lyr-h input[type=color]{width:30px;height:30px;padding:0;border:0;margin:0;background:none}
.grow{flex:1;min-width:0}.grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{border:0;background:#edf2f7;border-radius:8px;width:38px;height:38px;font-size:16px}
.fi{padding:9px 6px;border-top:1px solid #f0f2f5;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:middle}
.info{background:#f7fafc;border-radius:8px;padding:8px 10px;font-size:14px}
.prev{overflow:auto;font-size:12px;margin:6px 0;border:1px solid #e2e8f0;border-radius:6px}
.prev table{border-collapse:collapse}.prev td{padding:3px 6px;border-bottom:1px solid #edf2f7;white-space:nowrap}
.prev tr:first-child td{font-weight:700;background:#f7fafc}
.menu .btn{width:100%;text-align:left}
.phico span{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.leaflet-tooltip.lbl{background:rgba(255,255,255,.85);border:0;box-shadow:none;padding:1px 4px;font:600 11px system-ui,sans-serif;color:#1a202c}
.leaflet-tooltip.lbl:before{display:none}
#map.below12 .lbl.lz12,#map.below14 .lbl.lz14,#map.below15 .lbl.lz15,#map.below16 .lbl.lz16,#map.below17 .lbl.lz17{display:none}
.lyr-h .ib{width:34px}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;margin:6px 0 0 30px;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
.lyr.act{border-color:var(--g);box-shadow:inset 3px 0 0 var(--g)}
details.props{margin-top:8px;font-size:14px}details.props summary{color:var(--g);font-weight:600}
.thumbs{display:flex;gap:6px;overflow-x:auto;margin-top:8px}.thumbs img{height:84px;border-radius:8px;flex:none}
.card.panel{position:fixed;left:8px;right:8px;bottom:calc(var(--bar) + var(--sb) + 8px);z-index:950;padding:10px 12px}
.arrow{width:64px;height:64px;transition:transform .3s}
.vh{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid #d53f8c;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.vh.mid{width:16px;height:16px;border-width:2px;opacity:.75}
.vh.sel{background:#d53f8c}
progress{width:100%;height:14px}
</style>
</head>
<body>
<div id="mapwrap"><div id="map"></div><div id="cross"></div></div>

<div id="gps" class="card"><div>Buscando señal GPS…</div><div class="mut">Toca aquí para alternar formato de coordenadas</div></div>
<div id="fab"><button id="btnFollow" class="on" title="Seguir mi ubicación"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg></button></div>
<div id="rec" class="card hidden"></div>

<nav id="bar">
  <button data-act="point"><svg viewBox="0 0 24 24"><path d="M12 22s7-7.2 7-12.5A7 7 0 0 0 5 9.5C5 14.8 12 22 12 22z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Punto</button>
  <button data-act="photo"><svg viewBox="0 0 24 24"><path d="M4 7h3l2-3h6l2 3h3v13H4z"/><circle cx="12" cy="13" r="4"/></svg>Foto</button>
  <button data-act="line"><svg viewBox="0 0 24 24"><path d="M3 19c3-1 4-6 7-7s5 3 8 1 3-6 3-8"/><circle cx="3" cy="19" r="1.6"/><circle cx="21" cy="5" r="1.6"/></svg>Track</button>
  <button data-act="polygon"><svg viewBox="0 0 24 24"><path d="M5 4l13 2 3 10-9 5-9-6z"/></svg>Polígono</button>
  <button data-act="layers"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>Capas</button>
  <button data-act="more"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v3h16v-3"/></svg>Archivos</button>
</nav>

<div id="sheetWrap" class="hidden"><div id="sheet"></div></div>
<div id="dlgWrap" class="hidden"><div id="dlg"></div></div>
<div id="toast"></div>
<input type="file" id="file" multiple hidden>

<script src="js/app.js"></script>
<script src="js/offline.js"></script>
<script src="js/photos.js"></script>
<script src="js/nav.js"></script>
<script src="js/edit.js"></script>
<script src="js/georef.js"></script>
<script src="js/report.js"></script>
<script src="js/main.js"></script>

</body>
</html>
